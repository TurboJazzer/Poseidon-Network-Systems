[build]
  publish = "."
  functions = "netlify/functions"

[build.processing.html]
  pretty_urls = false

[[edge_functions]]
  path = "/*"
  function = "block-bots"

[[redirects]]
  from = "/api/send-quote"
  to = "/.netlify/functions/send-quote"
  status = 200
  [redirects.rate_limit]
    window_limit = 10
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200
  [redirects.rate_limit]
    window_limit = 20
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[redirects]]
  from = "/new-dell-equipment"
  to = "/new-dell-equipment.html"
  status = 301

[[redirects]]
  from = "/refurbished-dell-equipment"
  to = "/refurbished-dell-equipment.html"
  status = 301

[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 301

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301

[[redirects]]
  from = "/resources"
  to = "/resources.html"
  status = 301

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[redirects]]
  from = "/business-voip-cape-town"
  to = "/business-voip-cape-town.html"
  status = 301

[[redirects]]
  from = "/voip"
  to = "/business-voip-cape-town.html"
  status = 301

[[redirects]]
  from = "/api/bill-review"
  to = "/.netlify/functions/bill-review"
  status = 200
  [redirects.rate_limit]
    window_limit = 5
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[headers]]
  for = "/bill-review-thanks.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
