[build]
  publish = "."
  functions = "netlify/functions"

[[edge_functions]]
  path = "/*"
  function = "block-bots"

[[redirects]]
  from = "/api/send-quote"
  to = "/.netlify/functions/send-quote"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/new-dell-equipment"
  to = "/new-dell-equipment.html"
  status = 301
  force = true

[[redirects]]
  from = "/refurbished-dell-equipment"
  to = "/refurbished-dell-equipment.html"
  status = 301
  force = true

[[redirects]]
  from = "/faq"
  to = "/faq.html"
  status = 301
  force = true

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301
  force = true

[[redirects]]
  from = "/resources"
  to = "/resources.html"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
