[build]
  publish = "."
  functions = "netlify/functions"

[[edge_functions]]
  path = "/*"
  function = "block-bots"

[[redirects]]
  from = "/api/send-quote"
  to = "/.netlify/functions/send-quote"
  status = 200

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/new-dell-equipment"
  to = "/New%20Dell%20Equipment.html"
  status = 200

[[redirects]]
  from = "/refurbished-dell-equipment"
  to = "/Refurbished%20Dell%20Equipment.html"
  status = 200

[[redirects]]
  from = "/sitemap_index.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.png"
  status = 200

[[redirects]]
  from = "/faq"
  to = "/FAQ.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/Terms%20of%20Service.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/Privacy%20Policy.html"
  status = 200

[[redirects]]
  from = "/resources"
  to = "/Resources.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
