<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Staff: Dell offers | Poseidon Network Systems</title>
<meta name="description" content="Internal staff tool for Poseidon Network Systems: Dell offers from Universe Direct, with our prices and status. Not for public use.">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#F6F8FD;color:#0D1B4B;font-family:'Inter',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:#2D5BE3}a:hover{color:#1F47C4}
h1,h2{font-family:'Space Grotesk',sans-serif;margin:0}
header{background:#0D1B4B;color:#fff;padding:28px 20px 30px}
header .in,main,.back{max-width:1040px;margin:0 auto}
.tag{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8fabf5;margin:0 0 8px}
h1{font-size:28px;line-height:1.2}
header p.lead{margin:8px 0 0;color:#c9d4f5;font-size:15px;max-width:640px}
main{padding:20px 16px 56px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
button,select,input,textarea{font:inherit;color:inherit}
.chip{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid #C9D3EE;background:#fff;color:#0D1B4B;font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:#0D1B4B;border-color:#0D1B4B;color:#fff}
.chip small{font-weight:500;opacity:.75;margin-left:4px}
.btn{min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid #2D5BE3;background:#2D5BE3;color:#fff;font-weight:600;font-size:15px;cursor:pointer}
.btn:hover{background:#1F47C4;border-color:#1F47C4}
.btn.ghost{background:#fff;color:#2D5BE3}
.btn.ghost:hover{background:#EEF3FF}
.btn.danger{background:#fff;border-color:#C9D3EE;color:#9B2C2C}
.btn.danger:hover{background:#FDF0F0;border-color:#E3B4B4}
.btn[disabled]{opacity:.6;cursor:wait}
:is(button,select,input,textarea,a):focus-visible{outline:3px solid #9DB6F5;outline-offset:2px}
#msg{min-height:24px;margin:0 0 10px;font-size:14.5px}
#msg.err{color:#9B2C2C;background:#FDF0F0;border:1px solid #E3B4B4;border-radius:10px;padding:10px 14px}
#msg.okmsg{color:#1D5F3A}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.card{background:#fff;border:1px solid #E4E9F5;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:19px;line-height:1.25}
.top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.badge{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
.s-new{background:#E3ECFF;color:#1F47C4}.s-listed{background:#DDF3E6;color:#1D5F3A}
.s-sold{background:#E8EAF0;color:#4A5578}.s-dropped{background:#FCEBD2;color:#8A5300}
.specs{margin:0;color:#4A5578;font-size:14.5px}
.meta{margin:0;color:#4A5578;font-size:13.5px}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#F6F8FD;border-radius:10px;padding:10px 12px}
.prices div{font-size:13px;color:#4A5578}
.prices strong{display:block;font-size:16px;color:#0D1B4B}
.prices .wide{grid-column:1 / -1}
.notes{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto}
.row label{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.row select{min-height:44px;border:1px solid #C9D3EE;border-radius:10px;background:#fff;padding:6px 10px}
.empty{background:#fff;border:1px dashed #C9D3EE;border-radius:12px;padding:32px 20px;text-align:center;color:#4A5578}
dialog{border:none;border-radius:14px;padding:0;width:min(680px,calc(100% - 24px));box-shadow:0 18px 60px rgba(13,27,75,.35);color:#0D1B4B;background:#fff;max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(13,27,75,.55)}
dialog[open]:not(:modal){position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;overflow:auto}
form{padding:20px}
form h2{font-size:22px;margin-bottom:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1 / -1}
.f label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid #C9D3EE;border-radius:10px;background:#fff}
.f textarea{min-height:84px;resize:vertical}
.hint{font-size:12.5px;color:#4A5578;margin-top:4px}
#ferr{margin:12px 0 0;color:#9B2C2C;font-size:14.5px;min-height:22px}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:14px}
.back{padding:0 16px 40px;font-size:14px}
@media (max-width:560px){.fields{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="/staff/staff-dark.css">
</head>
<body>
<header><div class="in"><p class="tag">Poseidon staff only</p><h1>Dell offers</h1><p class="lead">Offers from Universe Direct. Save each one, set our price, and track it from new to sold.</p></div></header>
<main>
  <div class="bar">
    <div class="filters" id="filters" role="group" aria-label="Filter by status"></div>
    <button type="button" class="btn" id="add">Add offer</button>
  </div>
  <p id="msg" role="status" aria-live="polite"></p>
  <div id="list" class="grid" aria-busy="true"></div>
</main>
<p class="back"><a href="/staff/">← Back to staff tools</a></p>

<dialog id="dlg" aria-labelledby="dtitle">
  <form id="form" novalidate>
    <h2 id="dtitle">Add offer</h2>
    <div class="fields">
      <div class="f full"><label for="f-model">Model</label><input id="f-model" name="model" maxlength="120" required placeholder="Dell Latitude 5411"></div>
      <div class="f"><label for="f-cpu">Processor</label><input id="f-cpu" name="cpu" maxlength="80" placeholder="Intel Core i5, 10th Gen"></div>
      <div class="f"><label for="f-ram">Memory</label><input id="f-ram" name="ram" maxlength="40" placeholder="16GB DDR4"></div>
      <div class="f"><label for="f-storage">Storage</label><input id="f-storage" name="storage" maxlength="60" placeholder="256GB SSD"></div>
      <div class="f"><label for="f-screen">Screen</label><input id="f-screen" name="screen" maxlength="60" placeholder="14-inch FHD"></div>
      <div class="f"><label for="f-unit_condition">Condition</label>
        <select id="f-unit_condition" name="unit_condition"><option value="unknown">Not sure yet</option><option value="refurbished">Refurbished</option><option value="new">New</option></select></div>
      <div class="f"><label for="f-status">Status</label>
        <select id="f-status" name="status"><option value="new">New</option><option value="listed">Listed</option><option value="sold">Sold</option><option value="dropped">Dropped</option></select></div>
      <div class="f"><label for="f-supplier_price_excl_vat">Supplier price, excl. VAT (R)</label><input id="f-supplier_price_excl_vat" name="supplier_price_excl_vat" inputmode="decimal" placeholder="6450"></div>
      <div class="f"><label for="f-our_price_excl_vat">Our price, excl. VAT (R)</label><input id="f-our_price_excl_vat" name="our_price_excl_vat" inputmode="decimal" placeholder="7600">
        <div class="hint" id="vathint" aria-live="polite"></div></div>
      <div class="f"><label for="f-supplier">Supplier</label><input id="f-supplier" name="supplier" maxlength="80" value="Universe Direct"></div>
      <div class="f"><label for="f-first_seen">First seen</label><input id="f-first_seen" name="first_seen" type="date"></div>
      <div class="f full"><label for="f-source_url">Link to the email</label><input id="f-source_url" name="source_url" type="url" maxlength="500" placeholder="https://mail.google.com/..."></div>
      <div class="f full"><label for="f-source_ref">Email reference (optional)</label><input id="f-source_ref" name="source_ref" maxlength="200" placeholder="Used to stop the same offer being saved twice">
        <div class="hint">Leave blank unless you have a reference such as the email thread id.</div></div>
      <div class="f full"><label for="f-notes">Notes</label><textarea id="f-notes" name="notes" maxlength="1000" placeholder="Free laptop bag, stock level, delivery notes"></textarea></div>
    </div>
    <p id="ferr" role="alert"></p>
    <div class="actions"><button type="button" class="btn ghost" id="cancel">Cancel</button><button type="submit" class="btn" id="save">Save offer</button></div>
  </form>
</dialog>

<script>
(function () {
  'use strict';
  var API = '/staff/api/dell-offers';
  var VAT = 0.15;
  var STATUSES = [['all', 'All'], ['new', 'New'], ['listed', 'Listed'], ['sold', 'Sold'], ['dropped', 'Dropped']];
  var CONDITION = { refurbished: 'Refurbished', 'new': 'New', unknown: 'Condition not set' };
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var offers = [];
  var filter = 'all';
  var editingId = null;

  var $ = function (id) { return document.getElementById(id); };
  var list = $('list'), msg = $('msg'), dlg = $('dlg'), form = $('form'), ferr = $('ferr');

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function money(n) {
    return 'R' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  }
  function niceDate(s) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    return m ? (parseInt(m[3], 10) + ' ' + MONTHS[parseInt(m[2], 10) - 1] + ' ' + m[1]) : '';
  }
  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function say(text, kind) {
    msg.textContent = text || '';
    msg.className = kind || '';
  }

  function api(method, query, body) {
    var opts = { method: method, credentials: 'same-origin', headers: { 'X-Requested-With': 'pns-staff' } };
    if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    return fetch(API + (query || ''), opts).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          var e = new Error(data.error || (res.status === 401 ? 'Please sign in again.' : 'Something went wrong (' + res.status + ').'));
          e.status = res.status;
          throw e;
        }
        return data;
      });
    });
  }

  function counts() {
    var c = { all: offers.length, 'new': 0, listed: 0, sold: 0, dropped: 0 };
    offers.forEach(function (o) { if (c[o.status] !== undefined) c[o.status]++; });
    return c;
  }
  function renderFilters() {
    var c = counts(), box = $('filters');
    box.textContent = '';
    STATUSES.forEach(function (s) {
      var b = el('button', 'chip', s[1]);
      b.type = 'button';
      b.setAttribute('aria-pressed', String(filter === s[0]));
      b.appendChild(el('small', '', String(c[s[0]])));
      b.addEventListener('click', function () { filter = s[0]; render(); });
      box.appendChild(b);
    });
  }

  function specLine(o) {
    return [o.cpu, o.ram, o.storage, o.screen].filter(Boolean).join(' · ');
  }
  function priceBlock(o) {
    var p = el('div', 'prices');
    function cell(label, value, cls) {
      var d = el('div', cls || '');
      d.appendChild(document.createTextNode(label));
      d.appendChild(el('strong', '', value));
      p.appendChild(d);
    }
    cell('Supplier, excl. VAT', o.supplier_price_excl_vat === null ? 'Not set' : money(o.supplier_price_excl_vat));
    cell('Our price, excl. VAT', o.our_price_excl_vat === null ? 'Not set' : money(o.our_price_excl_vat));
    if (o.our_price_excl_vat !== null) {
      cell('Our price, incl. 15% VAT', money(Math.round(o.our_price_excl_vat * (1 + VAT) * 100) / 100));
      if (o.supplier_price_excl_vat !== null) {
        var margin = Math.round((o.our_price_excl_vat - o.supplier_price_excl_vat) * 100) / 100;
        var pct = o.our_price_excl_vat > 0 ? Math.round(margin / o.our_price_excl_vat * 100) : 0;
        cell('Margin, excl. VAT', money(margin) + ' (' + pct + '%)');
      }
    }
    return p;
  }

  function card(o) {
    var c = el('article', 'card');
    var top = el('div', 'top');
    top.appendChild(el('h2', '', o.model));
    top.appendChild(el('span', 'badge s-' + o.status, o.status));
    c.appendChild(top);
    var sp = specLine(o);
    if (sp) c.appendChild(el('p', 'specs', sp));
    c.appendChild(el('p', 'meta', (CONDITION[o.unit_condition] || '') + ' · ' + o.supplier + ' · first seen ' + niceDate(o.first_seen)));
    c.appendChild(priceBlock(o));
    if (o.notes) c.appendChild(el('p', 'notes', o.notes));
    if (o.source_url && /^https:\/\//i.test(o.source_url)) {
      var a = el('a', '', 'Open the email');
      a.href = o.source_url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      var pw = el('p', 'meta'); pw.appendChild(a); c.appendChild(pw);
    }
    var row = el('div', 'row');
    var lab = el('label', '', 'Status ');
    var sel = el('select');
    ['new', 'listed', 'sold', 'dropped'].forEach(function (s) {
      var op = el('option', '', s.charAt(0).toUpperCase() + s.slice(1)); op.value = s; if (s === o.status) op.selected = true; sel.appendChild(op);
    });
    sel.setAttribute('aria-label', 'Status for ' + o.model);
    sel.addEventListener('change', function () { quickStatus(o, sel.value, sel); });
    lab.appendChild(sel); row.appendChild(lab);
    var ed = el('button', 'btn ghost', 'Edit'); ed.type = 'button'; ed.addEventListener('click', function () { openForm(o); }); row.appendChild(ed);
    var del = el('button', 'btn danger', 'Delete'); del.type = 'button'; del.addEventListener('click', function () { remove(o); }); row.appendChild(del);
    c.appendChild(row);
    return c;
  }

  function render() {
    offers.sort(function (a, b) {
      if (a.first_seen !== b.first_seen) return a.first_seen < b.first_seen ? 1 : -1;
      return b.id - a.id;
    });
    renderFilters();
    list.textContent = '';
    list.setAttribute('aria-busy', 'false');
    var shown = offers.filter(function (o) { return filter === 'all' || o.status === filter; });
    if (!shown.length) {
      var e = el('div', 'empty');
      e.style.gridColumn = '1 / -1';
      e.appendChild(el('p', '', offers.length ? 'Nothing with that status.' : 'No offers saved yet. Add the first one from a Universe Direct email.'));
      list.appendChild(e);
      return;
    }
    shown.forEach(function (o) { list.appendChild(card(o)); });
  }

  function load() {
    list.setAttribute('aria-busy', 'true');
    return api('GET').then(function (d) { offers = d.offers || []; say(''); render(); })
      .catch(function (e) { list.textContent = ''; list.setAttribute('aria-busy', 'false'); renderFilters(); say(e.message, 'err'); });
  }

  function toPayload(o, over) {
    var p = {};
    ['model', 'cpu', 'ram', 'storage', 'screen', 'unit_condition', 'supplier', 'supplier_price_excl_vat', 'our_price_excl_vat', 'source_ref', 'source_url', 'first_seen', 'status', 'notes'].forEach(function (k) { p[k] = o[k]; });
    for (var k in over) p[k] = over[k];
    return p;
  }
  function replace(updated) {
    offers = offers.map(function (x) { return x.id === updated.id ? updated : x; });
  }
  function quickStatus(o, status, sel) {
    sel.disabled = true;
    api('PUT', '?id=' + o.id, toPayload(o, { status: status }))
      .then(function (d) { replace(d.offer); say('Saved: ' + d.offer.model + ' is now ' + d.offer.status + '.', 'okmsg'); render(); })
      .catch(function (e) { say(e.message, 'err'); render(); });
  }
  function remove(o) {
    if (!window.confirm('Delete "' + o.model + '"? This cannot be undone.')) return;
    api('DELETE', '?id=' + o.id)
      .then(function () { offers = offers.filter(function (x) { return x.id !== o.id; }); say('Deleted ' + o.model + '.', 'okmsg'); render(); })
      .catch(function (e) { say(e.message, 'err'); });
  }

  function vatHint() {
    var v = form.elements.our_price_excl_vat.value.replace(/[\s,]/g, '');
    var n = Number(v);
    $('vathint').textContent = v && isFinite(n) && n >= 0 ? 'That is ' + money(Math.round(n * (1 + VAT) * 100) / 100) + ' including 15% VAT.' : '';
  }
  function openForm(o) {
    editingId = o ? o.id : null;
    form.reset();
    ferr.textContent = '';
    $('dtitle').textContent = o ? 'Edit offer' : 'Add offer';
    $('save').textContent = o ? 'Save changes' : 'Save offer';
    var f = form.elements;
    f.supplier.value = 'Universe Direct';
    f.first_seen.value = today();
    if (o) {
      ['model', 'cpu', 'ram', 'storage', 'screen', 'supplier', 'source_ref', 'source_url', 'first_seen', 'notes'].forEach(function (k) { f[k].value = o[k] === null ? '' : o[k]; });
      f.unit_condition.value = o.unit_condition; f.status.value = o.status;
      f.supplier_price_excl_vat.value = o.supplier_price_excl_vat === null ? '' : o.supplier_price_excl_vat;
      f.our_price_excl_vat.value = o.our_price_excl_vat === null ? '' : o.our_price_excl_vat;
    }
    vatHint();
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    f.model.focus();
  }
  function closeForm() {
    if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open');
  }

  form.elements.our_price_excl_vat.addEventListener('input', vatHint);
  $('add').addEventListener('click', function () { openForm(null); });
  $('cancel').addEventListener('click', closeForm);
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    ferr.textContent = '';
    var f = form.elements, p = {};
    ['model', 'cpu', 'ram', 'storage', 'screen', 'unit_condition', 'supplier', 'supplier_price_excl_vat', 'our_price_excl_vat', 'source_ref', 'source_url', 'first_seen', 'status', 'notes'].forEach(function (k) { p[k] = f[k].value.trim(); });
    if (!p.model) { ferr.textContent = 'Please enter the model.'; f.model.focus(); return; }
    var btn = $('save'); btn.disabled = true;
    var req = editingId ? api('PUT', '?id=' + editingId, p) : api('POST', '', p);
    req.then(function (d) {
      if (editingId) replace(d.offer); else offers.unshift(d.offer);
      closeForm(); say('Saved ' + d.offer.model + '.', 'okmsg'); render();
    }).catch(function (e) { ferr.textContent = e.message; }).then(function () { btn.disabled = false; });
  });

  load();
})();
</script>
</body>
</html>
