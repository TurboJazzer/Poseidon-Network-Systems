<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Staff tools | Poseidon Network Systems</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#F6F8FD;color:#0D1B4B;font-family:'Inter',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:#2D5BE3}a:hover{color:#1F47C4}
header{background:#0D1B4B;color:#fff;padding:28px 20px 30px}
header .in,main{max-width:920px;margin:0 auto}
.tag{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8fabf5;margin:0 0 8px}
h1,h2{font-family:'Space Grotesk',sans-serif;margin:0}
h1{font-size:28px;line-height:1.2}
main{padding:24px 16px 64px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
a.tool{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid #E4E9F5;border-radius:12px;padding:20px;text-decoration:none;color:#0D1B4B;min-height:44px;transition:border-color .15s,box-shadow .15s}
a.tool:hover{border-color:#2D5BE3;box-shadow:0 4px 16px rgba(13,27,75,.08);color:#0D1B4B}
a.tool:focus-visible{outline:3px solid #9DB6F5;outline-offset:2px}
a.tool h2{font-size:19px}
a.tool p{margin:0;color:#4A5578;font-size:14.5px}
a.tool span{margin-top:6px;font-size:14px;font-weight:600;color:#2D5BE3}
.back{max-width:920px;margin:0 auto;padding:0 16px;font-size:14px}
</style>
</head>
<body>
<header><div class="in"><p class="tag">Poseidon staff only</p><h1>Staff tools</h1></div></header>
<main>
  <a class="tool" href="/staff/voip-checklist.html">
    <h2>VoIP quote and readiness checklist</h2>
    <p>One checklist per VoIP enquiry, from first contact to go-live.</p>
    <span>Open checklist →</span>
  </a>
  <a class="tool" href="/staff/product-flyer-template.html">
    <h2>Product flyer template</h2>
    <p>Make a 1080 × 1350 PNS flyer for Facebook and WhatsApp.</p>
    <span>Open flyer template →</span>
  </a>
</main>
<p class="back"><a href="/">← Back to website</a></p>
</body>
</html>
